[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acid-ai"
version = "0.1.0"
description = "ACID AI — AI-Powered CI/CD Failure Diagnosis & Self-Healing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "anthropic==2.0.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.17.0",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "flake8==7.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
